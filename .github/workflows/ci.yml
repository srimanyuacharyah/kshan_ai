name: KSHAN Continuous Integration & Delivery (CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. BACKEND TEST & INTEGRATION SUITE
  # ============================================================================
  backend-ci:
    name: Backend Tests & Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Full Backend Test Suite (Pytest)
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: kshan_ci_testing_jwt_secret_key
          DEMO_MODE: "true"
          EMBEDDING_DIMENSION: 768
        run: |
          pytest -v backend/tests

  # ============================================================================
  # 2. MCP SERVER INTEGRATION SUITE
  # ============================================================================
  mcp-ci:
    name: MCP Server & Tool Discovery Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install MCP & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r mcp-server/requirements.txt

      - name: Run MCP Server & Client Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: kshan_ci_testing_jwt_secret_key
          DEMO_MODE: "true"
        run: |
          pytest -v backend/tests/test_mcp_server_and_tools.py

  # ============================================================================
  # 3. FRONTEND PRODUCTION BUILD & VALIDATION
  # ============================================================================
  frontend-ci:
    name: React Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Build Artifacts Exist
        run: |
          test -f dist/index.html
          echo "Production frontend build verified successfully."

  # ============================================================================
  # 4. DOCKER CONTAINERIZATION BUILD VALIDATION
  # ============================================================================
  docker-validation:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci, mcp-ci ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: kshan-backend:ci-test

      - name: Validate MCP Server Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: mcp-server/Dockerfile
          push: false
          tags: kshan-mcp-server:ci-test

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: kshan-frontend:ci-test

  # ============================================================================
  # 5. SECURITY & DEPENDENCY AUDIT
  # ============================================================================
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check for Unintended Secrets in Repository
        run: |
          echo "Scanning for unencrypted private keys or real env files..."
          if find . -maxdepth 2 -name ".env" ! -name ".env.example" | grep -q .; then
            echo "ERROR: Real .env file detected in repository root!"
            exit 1
          fi
          echo "No unauthorized secrets detected."
